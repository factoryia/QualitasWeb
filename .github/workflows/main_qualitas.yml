
name: Build and deploy Node.js app to Azure Web App - qualitas

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read #This is required for actions/checkout

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js version
        uses: actions/setup-node@v3
        with:
          node-version: '22.x'

      - name: npm install, build
        run: |
          npm install
          npm run build

      - name: Copy static files to standalone
        run: |
          cp -R .next/static .next/standalone/.next/static
          cp -R public .next/standalone/public

      - name: Zip artifact for deployment
        run: zip -r node-app.zip .next/standalone/

      - name: Upload artifact for deployment job
        uses: actions/upload-artifact@v4
        with:
          name: node-app
          path: node-app.zip

  deploy:
    runs-on: ubuntu-latest
    needs: build
    permissions:
      id-token: write #This is required for requesting the JWT
      contents: read #This is required for actions/checkout

    steps:
      - name: Download artifact from build job
        uses: actions/download-artifact@v4
        with:
          name: node-app

      - name: Unzip artifact for deployment
        run: unzip node-app.zip -d release && mv release/.next/standalone .

      - name: Login to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZUREAPPSERVICE_CLIENTID_DEEE6938D6E1498FB334CA0731700507 }}
          tenant-id: ${{ secrets.AZUREAPPSERVICE_TENANTID_FB99C95DF41B49828B38C24CB91D07DC }}
          subscription-id: ${{ secrets.AZUREAPPSERVICE_SUBSCRIPTIONID_D4BA6697C6184879A71B41C453A370AD }}

      - name: 'Deploy to Azure Web App'
        id: deploy-to-webapp
        uses: azure/webapps-deploy@v3
        with:
          app-name: 'qualitas'
          slot-name: 'Production'
          package: .
          